spring:
  datasource:
    url: jdbc:yugabytedb://127.0.0.1:5433/acdc
    username: yugabyte
    password: yugabyte
    driver-class-name: com.yugabyte.Driver

# ---------------------------------------------------------------------------
# source (capture side)
# ---------------------------------------------------------------------------
producer:
  name: cdc-source
  connector-class: io.debezium.connector.postgresql.YugabyteDBConnector
  offset-storage: io.debezium.storage.jdbc.offset.JdbcOffsetBackingStore
  # currentSchema replaces the old offset-storage-jdbc-schema: the store has no
  # schema property, so placement can only come from the connection.
  offset-storage-jdbc-url: jdbc:postgresql://127.0.0.2:5433/acdc?currentSchema=public
  offset-storage-jdbc-user: yugabyte
  offset-storage-jdbc-password: yugabyte
  # Maps to offset.storage.jdbc.offset.table.name. Must stay unqualified -- the
  # store looks the table up as a name pattern and creates it without IF NOT
  # EXISTS, so a schema-qualified value fails on the second startup.
  offset-storage-jdbc-table: cdc_offset
  offset-flush-interval-ms: 10000
  hostname: 127.0.0.2
  port: 5433
  user: yugabyte
  password: yugabyte
  db-name: acdc
  plugin-name: yboutput
  replication-slot: ybdb
  # Adding a table here requires a restart, and an incremental snapshot if it
  # already holds data. See signal-data-collection below.
  table-list: public.products,public.orders,public.users,public.reviews
  schema-list: public
  server-id: ybdb
  server-name: ybdb
  publication-mode: filtered
  publication-name: ybdb
  task-max: 1
  topic-prefix: ybdb
  timestamp-precision-mode: adaptive_time_microseconds
  log-errors-include-messages: true
  # Required by consumer.enable-transaction-boundary: supplies the BEGIN/END
  # markers that delimit a source transaction.
  provide-transaction-metadata: true
  # Keeps the slot's confirmed LSN advancing while the captured tables are idle.
  heartbeat-interval-ms: 10000
  poll-interval-ms: 100
  max-batch-size: 5000
  max-queue-size: 10000
  replica-identity: public.*:FULL
  snapshot-mode: initial

# ---------------------------------------------------------------------------
# apply behaviour
# ---------------------------------------------------------------------------
consumer:
  # true  -> buffer each source transaction and commit it atomically; the sink
  #          never exposes a partial source transaction
  # false -> commit ordered batches of batch-size rows; order is preserved but a
  #          source transaction may span several sink commits
  enable-transaction-boundary: true
  # Group N adjacent source transactions into one sink commit. Raising this
  # trades commit granularity for throughput and never exposes a partial
  # transaction -- it is the throughput lever to reach for, not concurrency.
  transactions-per-commit: 1
  batch-size: 500
  max-buffered-rows: 50000
  flush-interval-ms: 2000
  drain-interval-ms: 30000
  # Master switch for DDL against the sink, off by default.
  # none  -> never issue DDL. The sink is still checked read-only at startup of
  #          each table's first batch, so a missing table or a missing ON CONFLICT
  #          target fails immediately instead of mid-apply.
  # basic -> propagate ADD COLUMN and lossless type widening. Opt in only when
  #          this pipeline owns the sink schema: a rename is indistinguishable
  #          from a drop plus an add, and a new column gets no backfill.
  schema-evolution: none
  # Both subordinate to schema-evolution -- neither does anything while it is none.
  auto-create-tables: true
  allow-column-drop: false
  # Created in the sink at startup. Stays empty until the first transaction
  # commits -- the watermark write is inside the row transaction, so a failing
  # apply rolls it back too.
  apply-state-table: cdc_apply_state
  apply-state-schema: public
  schema-audit: true
  schema-audit-table: cdc_schema_audit
  # Records the commit LSN the sink has reached. Skipping on it is off because a
  # YugabyteDB slot's LSNs restart low when the slot is recreated, which would
  # make every new transaction look already-applied. Every statement is
  # idempotent, so replay is safe without it.
  skip-applied-lsn: false
  # Replication origin names to discard, matched against source.origin on each
  # event. This is loop prevention -- see README. Only matches if the writer tags
  # its transactions with pg_replication_origin_session_setup(); a plain JDBC
  # write carries no origin at all.
  ignore-origins: []
  apply-origin-name: atoc
  ignore-replicated-changes: true

retry:
  max-attempts: 5
  multiplier: 3
  initial-interval-in-ms: 500
  max-interval-in-ms: 30000
