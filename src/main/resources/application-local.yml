# ---------------------------------------------------------------------------
# Kafka ingestion profile.
#
# The source half of the pipeline is gone here: no replication slot, no
# publication, no Debezium offset table. Kafka Connect owns all of that, and
# this application only consumes topics and applies rows. The entire producer:
# block is unused under this profile.
#
# Run with: -Dspring-boot.run.profiles=local
# ---------------------------------------------------------------------------

# sink (apply side) -- unchanged from the embedded profiles
spring:
  datasource:
    url: jdbc:yugabytedb://127.0.0.1:5433/acdc
    username: yugabyte
    password: yugabyte
    driver-class-name: com.yugabyte.Driver

kafka:
  bootstrap-servers: localhost:9092
  # Also the key under which applied offsets are stored in the sink. Two
  # deployments writing to the same sink must not share it.
  consumer-group: cdc-apply
  # Which topics depends entirely on transaction-scope below.
  #
  # global scope -> ONE funnelled topic on ONE partition, carrying every table
  #   AND the transaction markers. On the Connect side:
  #     transforms: route
  #     transforms.route.type: io.debezium.transforms.ByLogicalTableRouter
  #     transforms.route.topic.regex: (.*)
  #     transforms.route.topic.replacement: ybdb.all
  #     transforms.route.key.enforce.uniqueness: false
  #   and create ybdb.all with partitions=1. The producer must be idempotent
  #   (Kafka 3.x default) or max.in.flight.requests.per.connection=1, or a
  #   retry silently reorders within the partition.
  #
  # table scope -> ordinary per-table topics. Use topic-pattern rather than an
  #   explicit list and a new table is picked up without a restart: Debezium
  #   names them <prefix>.<schema>.<table>, so this follows the capture set as it
  #   grows. Anchor at the schema -- a bare 'ybdb\..*' would also match
  #   ybdb.transaction, whose markers mean nothing once partitions are not
  #   co-ordered.
  #
  # Set exactly one of topics / topic-pattern.
  topic-pattern: "ybdb\\.public\\..*"
  # topics:
  #   - ybdb.all
  max-poll-records: 500
  auto-offset-reset: earliest
  # Worst-case delay before a topic newly matching topic-pattern is discovered.
  # Discovery triggers a rebalance, so do not set this very low.
  metadata-max-age-ms: 300000
  # Must stay 1 while consumer.apply-origin-name is set: the apply pool is
  # pinned to one connection to hold the replication origin, so extra listener
  # threads would only contend for it. Validated at startup.
  concurrency: 1
  # Seek to what the sink durably applied rather than to Kafka's committed
  # offset. The sink offset is written inside the row transaction, so it cannot
  # disagree with the data; Kafka's commit happens after and can lag it.
  seek-to-sink-offset: true
  offset-table: cdc_kafka_offsets
  # The apply side derives sink types from the Connect schema, so the connector
  # must run JsonConverter with schemas.enable=true (or an Avro converter
  # against a registry). Schemaless JSON cannot drive this pipeline.
  # json -> no registry to run, but the whole schema is repeated in every message
  #         (commonly 5-10x on a wide table), which also means fewer records fit a
  #         fetch and commit units come out smaller than max-poll-records suggests.
  # avro -> compact, and incompatible source changes are rejected at publish time
  #         rather than halting this pipeline. Needs -Pavro at build time and a
  #         schema-registry-url. Anything else is a Converter class name.
  converter: json
  # schema-registry-url: http://localhost:8081
  # converter-properties:
  #   basic.auth.credentials.source: USER_INFO
  #   schema.registry.basic.auth.user.info: user:password
  # json only -- Avro always carries a schema. Must stay true: sink types are
  # derived from the Connect schema, so schemaless JSON has nothing to derive from.
  schemas-enabled: true

consumer:
  # global -> needs the single-partition funnel described above
  # table  -> one source transaction's changes to one table; works on ordinary
  #           per-table topics, needs no markers, and is the option to pick if
  #           you would rather not funnel
  transaction-scope: table
  transactions-per-commit: 1
  batch-size: 500
  max-buffered-rows: 50000
  flush-interval-ms: 2000
  drain-interval-ms: 30000
  apply-state-table: cdc_apply_state
  apply-state-schema: public
  # Redundant under Kafka: the offset table already bounds replay exactly, and
  # a topic offset has none of the slot-recreation hazards an LSN does.
  skip-applied-lsn: false
  ignore-origins: []
