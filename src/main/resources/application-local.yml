spring:
  datasource:
    url: jdbc:yugabytedb://[source2_ip]:5433/[db_name]
    username: yugabyte
    password: yugabyte
    driver-class-name: com.yugabyte.Driver

# ---------------------------------------------------------------------------
# source (capture side)
# ---------------------------------------------------------------------------
producer:
  name: cdc-source
  connector-class: io.debezium.connector.postgresql.YugabyteDBConnector
  offset-storage: io.debezium.storage.jdbc.offset.JdbcOffsetBackingStore
  offset-storage-jdbc-url: jdbc:postgresql://[source1_ip]:5433/[db_name]?currentSchema=public
  offset-storage-jdbc-user: yugabyte
  offset-storage-jdbc-password: yugabyte
  offset-storage-jdbc-table: cdc_offset
  offset-flush-interval-ms: 10000
  hostname: [source1_ip]
  port: 5433
  user: yugabyte
  password: yugabyte
  db-name: [db_name]
  plugin-name: yboutput
  replication-slot: ybdb
  # Adding a table here requires a restart, and gets streaming only -- this slot
  # will never backfill rows the table already holds. Neither snapshot-mode nor
  # signal-data-collection changes that; a backfill needs a separate slot. See
  # "Adding a table to the capture set" in the README.
  table-list: public.products,public.orders,public.users,public.reviews
  schema-list: public
  server-id: ybdb
  server-name: ybdb
  publication-mode: filtered
  publication-name: ybdb
  task-max: 1
  topic-prefix: ybdb
  timestamp-precision-mode: adaptive_time_microseconds
  log-errors-include-messages: true
  # Required by consumer.enable-transaction-boundary: supplies the BEGIN/END
  # markers that delimit a source transaction.
  provide-transaction-metadata: true
  # Keeps the slot's confirmed LSN advancing while the captured tables are idle.
  heartbeat-interval-ms: 10000
  poll-interval-ms: 100
  max-batch-size: 5000
  max-queue-size: 10000
  replica-identity: public.*:FULL
  snapshot-mode: initial

# ---------------------------------------------------------------------------
# apply behaviour
# ---------------------------------------------------------------------------
consumer:
  # true  -> buffer each source transaction and commit it atomically; the sink
  #          never exposes a partial source transaction
  # false -> commit ordered batches of batch-size rows; order is preserved but a
  #          source transaction may span several sink commits
  enable-transaction-boundary: true
  # Group N adjacent source transactions into one sink commit. Raising this
  # trades commit granularity for throughput and never exposes a partial
  # transaction -- it is the throughput lever to reach for, not concurrency.
  transactions-per-commit: 1
  batch-size: 500
  max-buffered-rows: 50000
  flush-interval-ms: 2000
  drain-interval-ms: 30000
  # Created in the sink at startup. Stays empty until the first transaction
  # commits -- the watermark write is inside the row transaction, so a failing
  # apply rolls it back too.
  apply-state-table: cdc_apply_state
  apply-state-schema: public
  # What to do about a column the change events carry that the sink lacks.
  # skipIfNull -> leave it out of the write while its value is null, and fail
  #               naming the column and key on the first non-null one. A source
  #               column added ahead of the sink migration is routine, and halting
  #               everything over one that may never carry a value is a large
  #               blast radius for nothing. Nothing is lost silently.
  # fail       -> refuse to apply the table at all, before any row is written.
  unknown-columns: skipIfNull
  # How long a sink shape stays cached once it is known to be missing columns.
  # Verification is normally keyed on the schema fingerprint, which describes the
  # SOURCE -- so when the fix is a sink migration the fingerprint never changes and
  # the cached result would never expire. This bounds that window, and applies only
  # while a table is degraded; a healthy table still costs one check per schema.
  sink-recheck-interval-ms: 30000
  # Last-writer-wins. none -> apply everything, last ARRIVAL wins, which lets a
  # bidirectional pair diverge permanently on a contended key. timestamp -> apply
  # only when the sink row is older, compared on a column the table already has.
  # That works because the column is IN the row: a local write on the sink
  # maintains it just as a replicated write does, so no trigger is needed. It
  # rests on the application setting that column on every UPDATE -- a
  # DEFAULT now() fires only on INSERT.
  conflict-resolution: none
  # Tried in order; first match with a time-like type wins. A table matching none
  # is applied unconditionally and says so at startup.
  conflict-columns: [updated_at, modified_at, last_modified, updated_on]
  # conflict-column-overrides:
  #   public.orders: modified_on
  # Record rejected changes for reconciliation rather than only logging them. This
  # is a conflict LOG, not a dead-letter queue -- nothing here should be replayed,
  # last-writer-wins already decided. Safe to prune: nothing here is load-bearing.
  conflict-log: false
  conflict-log-table: cdc_conflict_log
  # Ties diverge if left alone: each side rejects the other's change and keeps its
  # own, so the two clusters end up holding different values with nothing left to
  # reconcile them. Flipping the comparison diverges just as badly, the other way.
  # nodeId settles it with a rule both sides evaluate to the same answer -- the
  # change from the higher id wins -- so exactly one side accepts the tie.
  # The two deployments MUST have distinct ids, mirrored: node/peer here are
  # peer/node over there. Validated at startup. Pairwise topologies only.
  conflict-tiebreak: none
  # conflict-node-id: a
  # conflict-peer-id: b
  # Records the commit LSN the sink has reached. Skipping on it is off because a
  # YugabyteDB slot's LSNs restart low when the slot is recreated, which would
  # make every new transaction look already-applied. Every statement is
  # idempotent, so replay is safe without it.
  skip-applied-lsn: false
  # Replication origin FAMILIES to discard, matched as PREFIXES against
  # source.origin. This is loop prevention -- see README. Only matches if the writer tags
  # its transactions with pg_replication_origin_session_setup(); a plain JDBC
  # write carries no origin at all. Name the peer's family
  # (<their-prefix>_<their-slot>) -- prefix matching means the filter survives
  # the peer recreating its slot or adding lanes.
  ignore-origins: []
  # PREFIX, not the literal origin: OriginNames composes
  # <prefix>_<slot>_<lane>, so this claims 'atoc_<slot>_1'. Composing the slot in is
  # what stops two pipelines reading different slots but writing to the same sink
  # from both claiming one static name (the second dies with 55006).
  apply-origin-name: atoc
  ignore-replicated-changes: true
